<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>4주차 페이지 꾸미기</title>
  <!-- 2. style.css 외부 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 3. 제목(h1) -->
  <h1>나의 4주차 웹 페이지</h1>

  <!-- 4. 본문에 padding과 배경색을 넣어 만든 카드 -->
  <div class="card">
    <h2>소개</h2>
    <p>안녕하세요! HTML과 CSS를 활용해 멋진 나만의 카드 페이지를 만들고 있습니다.</p>
  </div>

  <!-- 5. 좋아하는 것 목록을 Flexbox로 가로 정렬 -->
  <div class="favorite-section">
    <h2>내가 좋아하는 것들</h2>
    <div class="flex-container">
      <div class="favorite-item">🎮 게임</div>
      <div class="favorite-item">🎵 음악</div>
      <div class="favorite-item">✈️ 여행</div>
      <div class="favorite-item">☕ 커피</div>
    </div>
  </div>

</body>
</html>
